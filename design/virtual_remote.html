<script>
  (function() {
    function vibrate(ms) {
      if (navigator.vibrate) {
        navigator.vibrate(ms || 18);
      }
    }

    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    let toastTimeout;

    function showFeedback(text) {
      if (toastTimeout) clearTimeout(toastTimeout);
      toastText.textContent = text;
      toast.classList.remove('opacity-0');
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 1200);
    }

    const clickables = [
      { id: 'btn-a', haptic: 28, label: 'A Pressed' },
      { id: 'dpad-up', haptic: 15, label: 'D-Pad Up' },
      { id: 'dpad-down', haptic: 15, label: 'D-Pad Down' },
      { id: 'dpad-left', haptic: 15, label: 'D-Pad Left' },
      { id: 'dpad-right', haptic: 15, label: 'D-Pad Right' },
      { id: 'btn-minus', haptic: 20, label: 'Minus' },
      { id: 'btn-home', haptic: 35, label: 'Home Channel Menu' },
      { id: 'btn-plus', haptic: 20, label: 'Plus' },
      { id: 'btn-1', haptic: 22, label: 'Button 1' },
      { id: 'btn-2', haptic: 22, label: 'Button 2' },
      { id: 'btn-trigger', haptic: 45, label: 'B Trigger Pull' }
    ];

    clickables.forEach(item => {
      const el = document.getElementById(item.id);
      if (el) {
        el.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          vibrate(item.haptic);
        });
      }
    });

    const recenterBtn = document.getElementById('btn-recenter');
    let recenterTimer;
    if (recenterBtn) {
      recenterBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        vibrate(30);
        recenterTimer = setTimeout(() => {
          vibrate([40, 60, 40]);
          showFeedback('Gyro Calibration Reset');
        }, 600);
      });
      recenterBtn.addEventListener('pointerup', () => clearTimeout(recenterTimer));
      recenterBtn.addEventListener('pointerleave', () => clearTimeout(recenterTimer));
    }
  })();
</script></main></body></html>
