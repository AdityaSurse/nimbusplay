<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NimbusPlay — Console (Phase 2 Relay)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 24px; font-weight: 700; color: var(--accent); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      background: var(--border);
    }
    .badge.connected { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .badge.disconnected { background: rgba(239, 68, 68, 0.15); color: var(--error); }
    .badge.reconnecting { background: rgba(245, 158, 11, 0.15); color: var(--warning); }

    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      flex: 1;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #ffffff;
      border-radius: 8px;
    }
    #qrcode-canvas {
      width: 200px !important;
      height: 200px !important;
    }
    .room-display {
      text-align: center;
      color: #0f172a;
    }
    .room-code {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #0284c7;
    }
    .room-url {
      font-size: 11px;
      color: #64748b;
      word-break: break-all;
    }

    .status-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 14px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 6px;
    }
    .status-label { color: var(--text-muted); }
    .status-val { font-weight: 600; }

    .btn {
      padding: 8px 16px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }

    .debug-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 400px;
    }
    .debug-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .log-container {
      flex: 1;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #38bdf8;
      overflow-y: auto;
      max-height: 520px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-line {
      line-height: 1.4;
      word-break: break-all;
    }
    .log-time { color: var(--text-muted); margin-right: 8px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>NimbusPlay Console</h1>
      <span style="font-size: 13px; color: var(--text-muted);">Phase 2: WebSocket Relay & Single-Origin Pairing</span>
    </div>
    <div style="display: flex; gap: 10px;">
      <span id="relay-status" class="badge connecting">Relay: Connecting...</span>
      <span id="peer-status" class="badge disconnected">Controller: Waiting</span>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <div class="card-title">Controller Pairing</div>
      <div class="qr-container">
        <canvas id="qrcode-canvas"></canvas>
        <div class="room-display">
          <div style="font-size: 11px; text-transform: uppercase; font-weight: bold; color: #475569;">Room Code</div>
          <div id="room-code-text" class="room-code">----</div>
          <div id="room-url-text" class="room-url">Fetching LAN IP...</div>
        </div>
      </div>

      <div class="status-list">
        <div class="status-row">
          <span class="status-label">Local Host IP</span>
          <span id="lan-ip-val" class="status-val">...</span>
        </div>
        <div class="status-row">
          <span class="status-label">Relay RTT Latency</span>
          <span id="rtt-val" class="status-val">-- ms</span>
        </div>
        <div class="status-row">
          <span class="status-label">Frames Received</span>
          <span id="frames-count" class="status-val">0</span>
        </div>
      </div>

      <button id="btn-vibrate" class="btn" style="margin-top: auto;">Send Haptic Ping to Controller</button>
    </div>

    <div class="card debug-panel">
      <div class="debug-header">
        <div class="card-title">Live Inbound Message Stream</div>
        <button id="btn-clear-logs" class="btn" style="padding: 4px 10px; font-size: 12px; background: var(--border); color: var(--text);">Clear</button>
      </div>
      <div id="log-container" class="log-container">
        <div class="log-line" style="color: var(--text-muted);">Waiting for messages from relay or controller...</div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/console/main.ts"></script>
</body>
</html>
